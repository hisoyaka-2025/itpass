<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問題画面</title>
<link rel="stylesheet" href="style.css">

<script>
const LS_KEY = "quizFlags";

let database = [];  
let currentIndex = -1;
let previousIndex = -1;

// ★ 正順／不順モード（true = 不順＝ランダム）
let isRandomMode = false;

/* ------------------------------
   ローカルストレージ読み込み
------------------------------ */
function loadFromLocalStorage() {
  const saved = localStorage.getItem(LS_KEY);

  if (!saved) {
    saveToLocalStorage();
    return;
  }

  let savedArray;
  try {
    savedArray = JSON.parse(saved);
  } catch {
    resetFlags();
    saveToLocalStorage();
    return;
  }

  if (!Array.isArray(savedArray) || savedArray.length !== database.length) {
    resetFlags();
    saveToLocalStorage();
    return;
  }

  for (let i = 0; i < database.length; i++) {
    database[i][7] = savedArray[i];
  }
}

/* ------------------------------
   ローカルストレージ保存
------------------------------ */
function saveToLocalStorage() {
  const flags = database.map(row => row[7]);
  localStorage.setItem(LS_KEY, JSON.stringify(flags));
}

/* ------------------------------
   全フラグ false にする
------------------------------ */
function resetFlags() {
  for (let i = 0; i < database.length; i++) {
    database[i][7] = false;
  }
}

/* ------------------------------
   不順（ランダム出題）
------------------------------ */
function showRandomQuestion() {
  let unsolved = database
    .map((q, idx) => ({ idx, solved: q[7] }))
    .filter(item => !item.solved)
    .map(item => item.idx);

  if (unsolved.length === 0) {
    const reset = confirm("すべて正解しました。リセットしますか？");
    if (reset) {
      resetFlags();
      saveToLocalStorage();
      unsolved = database.map((q, idx) => idx);
    } else {
      return;
    }
  }

  if (unsolved.length > 1) {
    unsolved = unsolved.filter(idx => idx !== previousIndex);
  }

  const r = Math.floor(Math.random() * unsolved.length);
  currentIndex = unsolved[r];
  previousIndex = currentIndex;

  loadQuestion(currentIndex);
}

/* ------------------------------
   正順（0 → 1 → 2…）
------------------------------ */
function showSequentialQuestion() {

  // ★ 未暗記の問題を順番に探す
  let nextIndex = -1;

  for (let i = currentIndex + 1; i < database.length; i++) {
    if (!database[i][7]) {
      nextIndex = i;
      break;
    }
  }

  // ★ 最初から探す
  if (nextIndex === -1) {
    for (let i = 0; i < database.length; i++) {
      if (!database[i][7]) {
        nextIndex = i;
        break;
      }
    }
  }

  // ★ 全部 true の場合
  if (nextIndex === -1) {
    const reset = confirm("すべて正解しました。リセットしますか？");
    if (reset) {
      resetFlags();
      saveToLocalStorage();
      currentIndex = 0;
      loadQuestion(currentIndex);
    }
    return;
  }

  currentIndex = nextIndex;
  loadQuestion(currentIndex);
}

/* ------------------------------
   問題読み込み
------------------------------ */
function loadQuestion(index) {
  const data = database[index];

  document.querySelector(".question-box").textContent = data[0];

  const choiceItems = document.querySelectorAll(".choice-item");
  const kana = ["ア", "イ", "ウ", "エ"];

  for (let i = 0; i < 4; i++) {
    const btn = choiceItems[i].querySelector("button");
    const span = choiceItems[i].querySelector("span");

    btn.textContent = kana[i];
    span.textContent = data[i + 1];
  }

  document.getElementById("your-answer").textContent = "";
  document.getElementById("correct-answer").textContent = "";
  document.getElementById("comment").textContent = "";
}

/* ------------------------------
   イベントハンドラ登録
------------------------------ */
function setupEventHandlers() {
  const buttons = document.querySelectorAll(".choice-item button");

  buttons.forEach(btn => {
    btn.addEventListener("click", function () {
      document.getElementById("your-answer").textContent = this.textContent;
    });
  });

  document.getElementById("btn-answer").addEventListener("click", function () {
    const yourAns = document.getElementById("your-answer").textContent;

    if (yourAns === "") {
      alert("回答を選択してください。");
      return;
    }

    const correct = database[currentIndex][6];
    const kanaMap = { "1": "ア", "2": "イ", "3": "ウ", "4": "エ" };
    const correctKana = kanaMap[correct];

    if (yourAns === correctKana) {
      document.getElementById("correct-answer").innerHTML =
        '<span style="color: blue;">正解</span>';
      database[currentIndex][7] = true;
      saveToLocalStorage();
    } else {
      document.getElementById("correct-answer").innerHTML =
        '<span style="color: red;">不正解</span>' +
        '<span style="color: black;">（正解　' + correctKana + '）</span>';
    }

    document.getElementById("comment").textContent = database[currentIndex][5];

    buttons.forEach(btn => btn.disabled = true);
    document.getElementById("btn-answer").disabled = true;
  });

  document.getElementById("btn-next").addEventListener("click", function () {

    if (isRandomMode) {
      showRandomQuestion();
    } else {
      showSequentialQuestion();
    }

    buttons.forEach(btn => btn.disabled = false);
    document.getElementById("btn-answer").disabled = false;
  });

  document.getElementById("btn-reset").addEventListener("click", function () {
    const result = confirm("暗記記録をリセットしますか？");
    if (result) {
      resetFlags();
      saveToLocalStorage();
      alert("暗記記録をリセットしました。");

      if (isRandomMode) {
        showRandomQuestion();
      } else {
        currentIndex = -1;
        showSequentialQuestion();
      }

      buttons.forEach(btn => btn.disabled = false);
    }
  });

  document.getElementById("btn-end").addEventListener("click", function () {
    alert("ブラウザの仕様により閉じられない場合があります。");
    window.close();
  });

 /* ------------------------------
   ★ 正順／不順切り替えボタン
------------------------------ */
document.getElementById("btn-rnd").addEventListener("click", function () {

  // トグル切り替え
  isRandomMode = !isRandomMode;

  if (isRandomMode) {
    // 不順（ランダム）
    this.textContent = "不順";
    showRandomQuestion();
  } else {
    // 正順（順番）
    this.textContent = "正順";
    currentIndex = -1;
    showSequentialQuestion();
  }
});

}
/* ------------------------------
   window.onload
------------------------------ */
window.onload = function () {

  fetch("database.json")
    .then(response => response.json())
    .then(json => {
      database = json;

      loadFromLocalStorage();

      // 初期は不順（ランダム）
      showRandomQuestion();

      setupEventHandlers();
    })
    .catch(err => {
      alert("database.json の読み込みに失敗しました");
      console.error(err);
    });
};
</script>

</head>
<body>

<div class="container">
   <div class="buttons">
    <button id="btn-answer">回答</button>
    <button id="btn-next">次の問題</button>
    <button id="btn-reset">リセット</button>
    <button id="btn-end">終了</button>
    <button id="btn-rnd">正順</button>
  </div>
  
  <h3>問題</h3>

  <div class="question-box">問題文</div>

  <div class="choices">
    <div class="choice-item"><button>ア</button><span></span></div>
    <div class="choice-item"><button>イ</button><span></span></div>
    <div class="choice-item"><button>ウ</button><span></span></div>
    <div class="choice-item"><button>エ</button><span></span></div>
  </div>

  <div class="answer-area">
    <span class="label">あなたの回答：</span>
    <span id="your-answer"></span>
  </div>

  <div class="correct-area">
    <span class="label">判定：</span>
    <span id="correct-answer"></span>
  </div>

  <div class="comment-area">
    <span class="label">解説：</span>
    <span id="comment"></span>
  </div> 
</div>

</body>
</html>
